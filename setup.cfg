[metadata]
name = lfiax
version = attr: lfiax.__version__
license = MIT
license_files = LICENSE
# url = https://github.com/huilab/sbiDOEMAN
author = Vincent Zaballa
author_email = vzaballa@uci.edu
keywords = conditional normalizing flows jax likelihood free simulation based inference
description = Conditional normalizing flows jax package for likelihood free inference
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3

[options]
zip_safe = False
include_package_data = True
install_requires =
    numpy<2
    jax>=0.4.26,<0.5
    jupyter
    distrax>=0.1.5,<0.1.6
    dm-haiku
    optax>=0.2.2,<0.2.5
    tensorflow>=2.18,<2.22
    tensorflow-probability[tf]>=0.25,<0.26
    tensorflow_datasets
    torch>=2.1
    torchsde>=0.2.6
    blackjax>=1.2.1,<1.3
    matplotlib
    tqdm
    scipy
    scikit-learn
setup_requires =
    setuptools
package_dir =
    = src
packages = find:
python_requires =
    >=3.10

[options.extras_require]
dev = twine
test = pytest
sir =
    hydra-core>=1.3,<1.4
    wandb
    sbi>=0.23,<0.24

[options.packages.find]
where = src
include = lfiax*

[bdist_wheel]
universal = 0
